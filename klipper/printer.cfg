# Baseline Klipper configuration for the 1-DOF ballscrew gantry.
# Verify all Octopus Pro V1.1 pins against your exact board revision before powering hardware.

[include macros.cfg]

[mcu]
# Replace this placeholder with the result of: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/<your-klipper-mcu-id>
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 30
max_accel: 1000

[stepper_x]
# These pins are placeholders for a single Octopus Pro stepper socket wired to the CL57Y PUL/DIR inputs.
step_pin: PF13
dir_pin: PF12
enable_pin: PF14
microsteps: 16
rotation_distance: 5
endstop_pin: ^PG6
position_endstop: 0
position_min: 0
position_max: 800
homing_speed: 22
second_homing_speed: 5
homing_retract_dist: 5

[stepper_x1]
step_pin: PG0
dir_pin: PG1
enable_pin: PF15
microsteps: 16
rotation_distance: 5
endstop_pin: ^PG10

# Klipper's cartesian parser requires Y and Z stepper sections. These are
# inert required sections: no Y/Z motor driver or endstop is wired
# to the Octopus. OpenDerm sends only X commands to Klipper; the Pico exclusively
# controls Y and Z. Use HOME_X_SAFE or G28 X, never an unqualified G28.
[stepper_y]
step_pin: PF11
dir_pin: PG3
enable_pin: PG5
microsteps: 16
rotation_distance: 5
endstop_pin: ^PG12
position_endstop: 0
position_max: 665
homing_speed: 15
second_homing_speed: 5
homing_retract_dist: 5

[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: PA0
microsteps: 16
rotation_distance: 5
endstop_pin: ^PG14
position_endstop: 0
position_max: 392
homing_speed: 15
second_homing_speed: 5
homing_retract_dist: 5

[respond]

# [gcode_button x_home]
# pin: ^PG6
# press_gcode:
#   RESPOND MSG="PG6 pressed"

[gcode_button x_max_limit]
pin: ^PG9
press_gcode:
  M112

# [gcode_button x1_home]
# pin: ^PG10
# press_gcode:
#     RESPOND MSG="PG10 pressed"

[gcode_button x1_max_limit]
pin: ^PG11
press_gcode:
   M112

[display_status]

# [force_move]
# enable_force_move: True

[idle_timeout]
timeout: 3600
