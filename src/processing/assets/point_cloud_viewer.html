<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDerm · 3D texture</title>
<style>
:root {color-scheme:dark; font:14px/1.5 system-ui,sans-serif; color:#e5eaf2; background:#10141c}
body {margin:0; overflow:hidden}
canvas {display:block; touch-action:none}
#panel {position:absolute; z-index:2; top:20px; left:20px; width:270px; padding:20px;
 background:#171e29eb; border:1px solid #354152; border-radius:12px; box-shadow:0 12px 40px #0005}
h1 {font-size:19px; margin:0 0 3px; letter-spacing:-.4px}
.subtitle, #help, #stats, .note {color:#a9b6c9; font-size:12px}
#name {overflow-wrap:anywhere; margin-bottom:18px}
#status {margin:12px 0; color:#8ce3cc}
#stats {white-space:pre-line; margin:14px 0}
label {display:flex; gap:8px; align-items:center; margin:12px 0}
input[type=range] {width:100%; accent-color:#70d9c1}
.row {display:flex; gap:6px; flex-wrap:wrap; margin:14px 0}
button, a {color:#e5eaf2; background:#273347; border:1px solid #42516a; border-radius:6px;
 padding:6px 10px; cursor:pointer; font:inherit; font-size:12px; text-decoration:none}
button:hover, a:hover {background:#35465f}
#help {position:absolute; bottom:18px; right:20px; text-align:right; pointer-events:none}
.note {border-top:1px solid #354152; padding-top:12px; margin-top:16px}
#panel.error #status {color:#ffaca4}
@media(max-width:600px) {#panel {top:10px; left:10px; width:220px; padding:14px}}
</style>
<script type="importmap">{"imports":{"three":"/three.module.min.js"}}</script>
</head>
<body>
<aside id="panel">
 <div class="subtitle">OPENDERM</div>
 <h1>3D photo texture</h1>
 <div id="name" class="subtitle">Point cloud</div>
 <div id="status" role="status">Loading viewer…</div>
 <div id="stats"></div>
 <label for="size">Point size <output id="sizeValue">1×</output></label>
 <input id="size" type="range" min="0.3" max="5" step="0.1" value="1">
 <label><input id="colors" type="checkbox" checked> Photo colors</label>
 <label><input id="grid" type="checkbox" checked> Reference grid</label>
 <div class="row">
  <button id="reset">Reset view</button><button id="top">Top</button>
  <button id="front">Front</button><button id="side">Side</button>
 </div>
 <div class="row"><button id="snapshot">Save PNG</button><a href="/cloud.ply" download="texture.ply">Download PLY</a></div>
 <div class="note">Geometry is interpolated between landmarks. Dense photo color does not add measured shape detail.</div>
</aside>
<div id="help">Drag to orbit · right-drag to pan · scroll to zoom<br>Coordinates in millimetres · X red / Y green / Z blue</div>
<script type="module">
const el = id => document.getElementById(id);
try {
 const [THREE, {OrbitControls}] = await Promise.all([import('three'), import('/OrbitControls.js')]);
 const infoResponse = await fetch('/info.json');
 if (!infoResponse.ok) throw new Error(`Metadata request failed (${infoResponse.status})`);
 const info = await infoResponse.json();
 if (!Number.isSafeInteger(info.points) || info.points <= 0 || !Number.isSafeInteger(info.data_offset)) {
   throw new Error('Invalid point-cloud metadata');
 }
 el('name').textContent = info.name;
 document.title = `${info.name} · OpenDerm 3D`;
 const response = await fetch('/cloud.ply');
 if (!response.ok) throw new Error(`Cloud request failed (${response.status})`);
 const size = Number(response.headers.get('Content-Length'));
 let buffer;
 if (response.body && size > 0) {
   const bytes = new Uint8Array(size), reader = response.body.getReader();
   let received = 0;
   while (true) {
     const {done, value} = await reader.read();
     if (done) break;
     if (received + value.byteLength > size) throw new Error('Unexpected cloud size; reload the viewer');
     bytes.set(value, received); received += value.byteLength;
     el('status').textContent = `Loading photo texture… ${Math.round(received / size * 100)}%`;
   }
   if (received !== size) throw new Error('Download was interrupted; reload the viewer');
   buffer = bytes.buffer;
 } else buffer = await response.arrayBuffer();
 if (buffer.byteLength !== info.data_offset + info.points * 15) throw new Error('Point cloud changed; reload the viewer');
 el('status').textContent = 'Preparing 3D view…';
 // Let the loading label paint before unpacking large clouds.
 await new Promise(resolve => requestAnimationFrame(resolve));
 const view = new DataView(buffer), positions = new Float32Array(info.points * 3);
 const photoColors = new Float32Array(info.points * 3);
 const linear = new Float32Array(256);
 for (let i = 0; i < 256; i++) {
   const c = i / 255; linear[i] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
 }
 for (let i = 0; i < info.points; i++) {
   const offset = info.data_offset + i * 15;
   for (let axis = 0; axis < 3; axis++) {
     const coordinate = view.getFloat32(offset + axis * 4, true);
     if (!Number.isFinite(coordinate)) throw new Error('Point cloud contains invalid coordinates');
     positions[i * 3 + axis] = coordinate;
     photoColors[i * 3 + axis] = linear[view.getUint8(offset + 12 + axis)];
   }
 }
 const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
 renderer.setSize(innerWidth, innerHeight);
 renderer.outputColorSpace = THREE.SRGBColorSpace;
 document.body.appendChild(renderer.domElement);
 const scene = new THREE.Scene(); scene.background = new THREE.Color('#10141c');
 const geometry = new THREE.BufferGeometry();
 geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
 geometry.setAttribute('color', new THREE.BufferAttribute(photoColors, 3));
 geometry.computeBoundingBox(); geometry.computeBoundingSphere();
 const center = geometry.boundingSphere.center.clone();
 const radius = Math.max(geometry.boundingSphere.radius, 0.001);
 const extent = geometry.boundingBox.getSize(new THREE.Vector3());
 // Display samples as small discs; adjustable in world units while zooming.
 const sprite = document.createElement('canvas'); sprite.width = sprite.height = 32;
 const context = sprite.getContext('2d');
 context.fillStyle = '#fff'; context.beginPath(); context.arc(16,16,15,0,Math.PI*2); context.fill();
 const baseSize = Math.max(radius / Math.sqrt(info.points) * 1.5, 0.03);
 const material = new THREE.PointsMaterial({vertexColors:true, size:baseSize,
   sizeAttenuation:true, map:new THREE.CanvasTexture(sprite), alphaTest:0.5, toneMapped:false});
 const cloud = new THREE.Points(geometry, material); scene.add(cloud);
 const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, radius / 10000, radius * 1000);
 camera.up.set(0,0,1);
 const controls = new OrbitControls(camera, renderer.domElement);
 controls.enableDamping = true; controls.dampingFactor = 0.12;
 controls.minDistance = radius * 0.003; controls.maxDistance = radius * 100;
 const gridSize = Math.max(Math.ceil(radius * 2 / 10) * 10, 10);
 const grid = new THREE.GridHelper(gridSize, Math.min(100, Math.max(2, Math.round(gridSize / 10))), 0x45536b, 0x273346);
 grid.rotation.x = Math.PI / 2; grid.position.set(center.x,center.y,geometry.boundingBox.min.z - radius * 0.03);
 scene.add(grid);
 const axes = new THREE.AxesHelper(radius * 0.18); axes.position.copy(geometry.boundingBox.min); scene.add(axes);
 function setView(direction, up = new THREE.Vector3(0,0,1)) {
   const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
   const limitingFov = Math.atan(Math.tan(halfFov) * Math.min(camera.aspect, 1));
   const distance = radius / Math.sin(limitingFov) * 1.15;
   camera.up.copy(up); camera.position.copy(center).addScaledVector(direction.normalize(), distance);
   controls.target.copy(center); controls.update();
 }
 const reset = () => setView(new THREE.Vector3(0.35,-0.6,1));
 reset();
 el('reset').onclick = reset;
 el('top').onclick = () => setView(new THREE.Vector3(0,0,1), new THREE.Vector3(0,1,0));
 el('front').onclick = () => setView(new THREE.Vector3(0,-1,0));
 el('side').onclick = () => setView(new THREE.Vector3(1,0,0));
 el('size').oninput = event => {
   const scale = Number(event.target.value); material.size = baseSize * scale;
   el('sizeValue').textContent = `${scale.toFixed(1)}×`;
 };
 el('colors').onchange = event => {
   material.vertexColors = event.target.checked; material.needsUpdate = true;
   material.color.set(event.target.checked ? '#ffffff' : '#b9cadb');
 };
 el('grid').onchange = event => {grid.visible = axes.visible = event.target.checked;};
 el('snapshot').onclick = () => {
   renderer.render(scene,camera);
   const link = document.createElement('a'); link.download = 'openderm-3d.png';
   link.href = renderer.domElement.toDataURL('image/png'); link.click();
 };
 el('stats').textContent = `${info.points.toLocaleString()} colored points\n` +
   `Extent ${extent.x.toFixed(1)} × ${extent.y.toFixed(1)} × ${extent.z.toFixed(1)} mm`;
 el('status').textContent = 'Ready';
 window.__opendermViewer = {points:info.points, ready:true};
 addEventListener('resize', () => {
   camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
   renderer.setSize(innerWidth,innerHeight);
 });
 function animate() {requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera);}
 animate();
} catch (error) {
 el('panel').classList.add('error');
 el('status').textContent = `Could not display cloud: ${error.message}`;
 console.error(error);
}
</script>
</body>
</html>
