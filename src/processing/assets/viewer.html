<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>__TITLE__</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#101216;color:#cfd6e1;
   font:13px/1.45 system-ui,sans-serif}
 #hud{position:absolute;top:10px;left:10px;background:#161a22cc;border:1px solid #2a3140;
   border-radius:8px;padding:10px 12px;min-width:210px;backdrop-filter:blur(4px);z-index:5}
 #hud h1{font-size:14px;margin:0 0 6px;color:#fff}
 #hud label{display:flex;gap:6px;align-items:center;cursor:pointer;margin:2px 0}
 #hud .btns{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
 #hud button{background:#26304a;border:1px solid #3a4a6a;color:#dfe7f5;border-radius:5px;
   padding:3px 10px;cursor:pointer;font-size:12px}
 #hud button:hover{background:#33406a}
 #stats{margin-top:8px;color:#8e99ad;font-size:11.5px;white-space:pre-line}
 #readout{position:absolute;bottom:10px;left:10px;background:#161a22cc;border:1px solid #2a3140;
   border-radius:8px;padding:7px 11px;font-family:ui-monospace,monospace;font-size:12px;z-index:5}
 #measure{color:#ffd479;font-weight:600}
 #help{position:absolute;bottom:10px;right:10px;background:#161a22aa;border:1px solid #2a3140;
   border-radius:8px;padding:7px 11px;font-size:11.5px;color:#8e99ad;z-index:5;text-align:right}
 #err{position:absolute;top:40%;width:100%;text-align:center;color:#ff7b72;display:none}
</style></head><body>
<div id="hud">
 <h1>3D skin scan</h1>
 <label><input type="checkbox" id="cb_tex" checked> Texture</label>
 <label><input type="checkbox" id="cb_shade"> Shaded relief</label>
 <label><input type="checkbox" id="cb_wire"> Wireframe</label>
 <label><input type="checkbox" id="cb_cams"> Cameras</label>
 <label><input type="checkbox" id="cb_lm"> Landmarks</label>
 <label><input type="checkbox" id="cb_grid" checked> Grid (10 mm)</label>
 <div class="btns">
  <button id="bt_top">Top</button><button id="bt_front">Front</button>
  <button id="bt_side">Side</button><button id="bt_reset">Reset</button>
  <button id="bt_shot">PNG</button>
 </div>
 <div id="stats"></div>
</div>
<div id="readout">cursor: — <br><span id="measure">measure: click two points</span></div>
<div id="help">drag&nbsp;rotate · right-drag&nbsp;pan · wheel&nbsp;zoom<br>
 click+click&nbsp;measure (mm) · double-click&nbsp;clear</div>
<div id="err">Failed to load embedded three.js — open this file in a modern browser
 (Chrome/Firefox/Edge).</div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script id="three_b64" type="text/plain">__THREE_B64__</script>
<script id="orbit_b64" type="text/plain">__ORBIT_B64__</script>
<script>
(async () => {
 const get_element_by_id = id => document.getElementById(id);
 const b64text = id => {
   const encoded_text = get_element_by_id(id).textContent.trim();
   if (!encoded_text) return null;
   const bin = atob(encoded_text); const decoded_bytes = new Uint8Array(bin.length);
   for (let byte_index = 0; byte_index < bin.length; byte_index++) decoded_bytes[byte_index] = bin.charCodeAt(byte_index);
   return new TextDecoder().decode(decoded_bytes);
 };
 const b64buf = encoded_text => {
   const bin = atob(encoded_text); const decoded_bytes = new Uint8Array(bin.length);
   for (let byte_index = 0; byte_index < bin.length; byte_index++) decoded_bytes[byte_index] = bin.charCodeAt(byte_index);
   return decoded_bytes.buffer;
 };
 let THREE, OrbitControls;
 try {
   const tsrc = b64text('three_b64');
   if (tsrc) {
     const turl = URL.createObjectURL(new Blob([tsrc], {type:'text/javascript'}));
     let osrc = b64text('orbit_b64').replace(/from\s+['"]three['"]/g, `from '${turl}'`);
     const ourl = URL.createObjectURL(new Blob([osrc], {type:'text/javascript'}));
     THREE = await import(turl);
     OrbitControls = (await import(ourl)).OrbitControls;
   } else {
     THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.min.js');
     OrbitControls = (await import('https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js')).OrbitControls;
   }
 } catch (import_error) { get_element_by_id('err').style.display = 'block'; console.error(import_error); return; }

 const payload = JSON.parse(get_element_by_id('payload').textContent);
 const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
 renderer.setPixelRatio(devicePixelRatio);
 renderer.setSize(innerWidth, innerHeight);
 document.body.appendChild(renderer.domElement);
 const scene = new THREE.Scene();
 scene.background = new THREE.Color(0x101216);
 const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 10000);

 // ---- mesh -------------------------------------------------------------
 const surface_geometry = new THREE.BufferGeometry();
 surface_geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(payload.mesh.positions)), 3));
 surface_geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(b64buf(payload.mesh.uvs)), 2));
 surface_geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(b64buf(payload.mesh.indices)), 1));
 surface_geometry.computeVertexNormals();
 surface_geometry.computeBoundingBox();
 const surface_bounding_box = surface_geometry.boundingBox, surface_center = new THREE.Vector3();
 surface_bounding_box.getCenter(surface_center);
 const surface_diagonal = surface_bounding_box.min.distanceTo(surface_bounding_box.max);

 const surface_texture = new THREE.TextureLoader().load(payload.texture, loaded_texture => {
   loaded_texture.colorSpace = THREE.SRGBColorSpace; loaded_texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
 });
 const textured_material = new THREE.MeshBasicMaterial({map: surface_texture, side: THREE.DoubleSide});
 const shaded_material = new THREE.MeshStandardMaterial({map: surface_texture, side: THREE.DoubleSide,
   roughness: 0.85, metalness: 0.0});
 const plain_material = new THREE.MeshStandardMaterial({color: 0xb89880, side: THREE.DoubleSide,
   roughness: 0.9});
 const mesh = new THREE.Mesh(surface_geometry, textured_material);
 scene.add(mesh);
 const wire = new THREE.Mesh(surface_geometry, new THREE.MeshBasicMaterial({wireframe: true,
   color: 0x44ff88, transparent: true, opacity: 0.25}));
 wire.visible = false; scene.add(wire);

 scene.add(new THREE.HemisphereLight(0xffffff, 0x404060, 1.1));
 const directional_light = new THREE.DirectionalLight(0xffffff, 1.2);
 directional_light.position.set(surface_center.x + surface_diagonal, surface_center.y - surface_diagonal, surface_center.z + surface_diagonal); scene.add(directional_light);

 // ---- cameras ------------------------------------------------------------
 const camera_geometry = new THREE.BufferGeometry();
 camera_geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(payload.cameras.segments)), 3));
 camera_geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(b64buf(payload.cameras.colors)), 3));
 const camera_frustums = new THREE.LineSegments(camera_geometry, new THREE.LineBasicMaterial({vertexColors: true,
   transparent: true, opacity: 0.55}));
 camera_frustums.visible = false; scene.add(camera_frustums);

 // ---- landmarks ----------------------------------------------------------
 const landmark_geometry = new THREE.BufferGeometry();
 landmark_geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(payload.landmarks.positions)), 3));
 landmark_geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(b64buf(payload.landmarks.colors)), 3));
 const landmark_points = new THREE.Points(landmark_geometry, new THREE.PointsMaterial({vertexColors: true, size: 0.35}));
 landmark_points.visible = false; scene.add(landmark_points);

 // ---- grid + axes ---------------------------------------------------------
 const grid = new THREE.GridHelper(Math.ceil(surface_diagonal/100)*100, Math.ceil(surface_diagonal/100)*10,
   0x39455c, 0x222a38);
 grid.rotation.x = Math.PI/2;
 grid.position.set(surface_center.x, surface_center.y, surface_bounding_box.min.z - 4);
 scene.add(grid);
 const axes = new THREE.AxesHelper(30);
 axes.position.set(surface_bounding_box.min.x - 10, surface_bounding_box.min.y - 10, surface_bounding_box.min.z);
 scene.add(axes);

 // ---- controls + views -----------------------------------------------------
 const controls = new OrbitControls(camera, renderer.domElement);
 controls.target.copy(surface_center);
 controls.enableDamping = true; controls.dampingFactor = 0.12;
 function setView(camera_offset_x, camera_offset_y, camera_offset_z, view_distance) {
   view_distance = view_distance || surface_diagonal * 1.1;
   camera.position.set(surface_center.x + camera_offset_x*view_distance, surface_center.y + camera_offset_y*view_distance, surface_center.z + camera_offset_z*view_distance);
   camera.up.set(0, camera_offset_z === 0 ? 0 : -1, camera_offset_z === 0 ? 1 : 0);
   controls.target.copy(surface_center); controls.update();
 }
 setView(0.25, 0.55, 0.8);
 get_element_by_id('bt_top').onclick   = () => setView(0, 0.001, 1);
 get_element_by_id('bt_front').onclick = () => setView(0, -1, 0.15);
 get_element_by_id('bt_side').onclick  = () => setView(1, 0, 0.15);
 get_element_by_id('bt_reset').onclick = () => setView(0.25, 0.55, 0.8);
 get_element_by_id('bt_shot').onclick  = () => {
   renderer.render(scene, camera);
   const download_link = document.createElement('a');
   download_link.href = renderer.domElement.toDataURL('image/png');
   download_link.download = 'skin_scan_3d.png'; download_link.click();
 };

 // ---- toggles --------------------------------------------------------------
 function updateMat() {
   const texture_enabled = get_element_by_id('cb_tex').checked, shading_enabled = get_element_by_id('cb_shade').checked;
   mesh.material = texture_enabled ? (shading_enabled ? shaded_material : textured_material) : plain_material;
 }
 get_element_by_id('cb_tex').onchange = updateMat;
 get_element_by_id('cb_shade').onchange = updateMat;
 get_element_by_id('cb_wire').onchange = change_event => wire.visible = change_event.target.checked;
 get_element_by_id('cb_cams').onchange = change_event => camera_frustums.visible = change_event.target.checked;
 get_element_by_id('cb_lm').onchange   = change_event => landmark_points.visible = change_event.target.checked;
 get_element_by_id('cb_grid').onchange = change_event => grid.visible = change_event.target.checked;

 // ---- stats ----------------------------------------------------------------
 const stats = payload.stats;
 get_element_by_id('stats').textContent =
   `${stats.n_frames} frames · ${stats.n_landmarks} landmarks` +
   `\nreproj RMS ${stats.rms_px} px (≈${stats.rms_mm} mm)` +
   `\n${stats.px_per_mm} px/mm on skin · area ${stats.area_cm2} cm²`;

 // ---- picking: cursor readout + measurement --------------------------------
 const ray = new THREE.Raycaster();
 const pointer_coordinates = new THREE.Vector2();
 const readout = get_element_by_id('readout'), measurement_readout = get_element_by_id('measure');
 let pointer_down_coordinates = null, measurement_markers = [], measurement_line = null;
 const mkMark = world_point => {
   const landmark_marker = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.6, surface_diagonal/400), 16, 12),
     new THREE.MeshBasicMaterial({color: 0xffd479}));
   landmark_marker.position.copy(world_point); scene.add(landmark_marker); return landmark_marker;
 };
 function pick(ev) {
   pointer_coordinates.x = (ev.clientX/innerWidth)*2 - 1; pointer_coordinates.y = -(ev.clientY/innerHeight)*2 + 1;
   ray.setFromCamera(pointer_coordinates, camera);
   const hit = ray.intersectObject(mesh, false);
   return hit.length ? hit[0].point : null;
 }
 addEventListener('pointermove', pointer_event => {
   const world_point = pick(pointer_event);
   readout.firstChild.textContent = world_point ?
     `x ${world_point.x.toFixed(2)}  y ${world_point.y.toFixed(2)}  z ${world_point.z.toFixed(2)} mm ` : 'cursor: — ';
 });
 addEventListener('pointerdown', pointer_event => pointer_down_coordinates = [pointer_event.clientX, pointer_event.clientY]);
 addEventListener('pointerup', pointer_event => {
   if (!pointer_down_coordinates) return;
   const moved = Math.hypot(pointer_event.clientX-pointer_down_coordinates[0], pointer_event.clientY-pointer_down_coordinates[1]);
   pointer_down_coordinates = null;
   if (moved > 5 || pointer_event.button !== 0) return;
   const world_point = pick(pointer_event);
   if (!world_point) return;
   if (measurement_markers.length === 2) { clearMeasure(); }
   measurement_markers.push(mkMark(world_point));
   if (measurement_markers.length === 2) {
     const point_a = measurement_markers[0].position, point_b = measurement_markers[1].position;
     const measurement_geometry = new THREE.BufferGeometry().setFromPoints([point_a, point_b]);
     measurement_line = new THREE.Line(measurement_geometry, new THREE.LineBasicMaterial({color: 0xffd479}));
     scene.add(measurement_line);
     measurement_readout.textContent = `measure: ${point_a.distanceTo(point_b).toFixed(2)} mm`;
   } else {
     measurement_readout.textContent = 'measure: pick second point…';
   }
 });
 function clearMeasure() {
   measurement_markers.forEach(landmark_marker => scene.remove(landmark_marker)); measurement_markers = [];
   if (measurement_line) scene.remove(measurement_line); measurement_line = null;
   measurement_readout.textContent = 'measure: click two points';
 }
 addEventListener('dblclick', clearMeasure);

 addEventListener('resize', () => {
   camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
   renderer.setSize(innerWidth, innerHeight);
 });
 (function loop(){ requestAnimationFrame(loop); controls.update();
   renderer.render(scene, camera); })();
})();
</script></body></html>
