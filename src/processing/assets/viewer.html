<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>__TITLE__</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#101216;color:#cfd6e1;
   font:13px/1.45 system-ui,sans-serif}
 #hud{position:absolute;top:10px;left:10px;background:#161a22cc;border:1px solid #2a3140;
   border-radius:8px;padding:10px 12px;min-width:210px;backdrop-filter:blur(4px);z-index:5}
 #hud h1{font-size:14px;margin:0 0 6px;color:#fff}
 #hud label{display:flex;gap:6px;align-items:center;cursor:pointer;margin:2px 0}
 #hud .btns{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
 #hud button{background:#26304a;border:1px solid #3a4a6a;color:#dfe7f5;border-radius:5px;
   padding:3px 10px;cursor:pointer;font-size:12px}
 #hud button:hover{background:#33406a}
 #stats{margin-top:8px;color:#8e99ad;font-size:11.5px;white-space:pre-line}
 #readout{position:absolute;bottom:10px;left:10px;background:#161a22cc;border:1px solid #2a3140;
   border-radius:8px;padding:7px 11px;font-family:ui-monospace,monospace;font-size:12px;z-index:5}
 #measure{color:#ffd479;font-weight:600}
 #help{position:absolute;bottom:10px;right:10px;background:#161a22aa;border:1px solid #2a3140;
   border-radius:8px;padding:7px 11px;font-size:11.5px;color:#8e99ad;z-index:5;text-align:right}
 #err{position:absolute;top:40%;width:100%;text-align:center;color:#ff7b72;display:none}
</style></head><body>
<div id="hud">
 <h1>3D skin scan</h1>
 <label><input type="checkbox" id="cb_tex" checked> Texture</label>
 <label><input type="checkbox" id="cb_shade"> Shaded relief</label>
 <label><input type="checkbox" id="cb_wire"> Wireframe</label>
 <label><input type="checkbox" id="cb_cams"> Cameras</label>
 <label><input type="checkbox" id="cb_lm"> Landmarks</label>
 <label><input type="checkbox" id="cb_grid" checked> Grid (10 mm)</label>
 <div class="btns">
  <button id="bt_top">Top</button><button id="bt_front">Front</button>
  <button id="bt_side">Side</button><button id="bt_reset">Reset</button>
  <button id="bt_shot">PNG</button>
 </div>
 <div id="stats"></div>
</div>
<div id="readout">cursor: — <br><span id="measure">measure: click two points</span></div>
<div id="help">drag&nbsp;rotate · right-drag&nbsp;pan · wheel&nbsp;zoom<br>
 click+click&nbsp;measure (mm) · double-click&nbsp;clear</div>
<div id="err">Failed to load embedded three.js — open this file in a modern browser
 (Chrome/Firefox/Edge).</div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script id="three_b64" type="text/plain">__THREE_B64__</script>
<script id="orbit_b64" type="text/plain">__ORBIT_B64__</script>
<script>
(async () => {
 const $ = id => document.getElementById(id);
 const b64text = id => {
   const b = $(id).textContent.trim();
   if (!b) return null;
   const bin = atob(b); const a = new Uint8Array(bin.length);
   for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
   return new TextDecoder().decode(a);
 };
 const b64buf = s => {
   const bin = atob(s); const a = new Uint8Array(bin.length);
   for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
   return a.buffer;
 };
 let THREE, OrbitControls;
 try {
   const tsrc = b64text('three_b64');
   if (tsrc) {
     const turl = URL.createObjectURL(new Blob([tsrc], {type:'text/javascript'}));
     let osrc = b64text('orbit_b64').replace(/from\s+['"]three['"]/g, `from '${turl}'`);
     const ourl = URL.createObjectURL(new Blob([osrc], {type:'text/javascript'}));
     THREE = await import(turl);
     OrbitControls = (await import(ourl)).OrbitControls;
   } else {
     THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.min.js');
     OrbitControls = (await import('https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js')).OrbitControls;
   }
 } catch (e) { $('err').style.display = 'block'; console.error(e); return; }

 const P = JSON.parse($('payload').textContent);
 const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
 renderer.setPixelRatio(devicePixelRatio);
 renderer.setSize(innerWidth, innerHeight);
 document.body.appendChild(renderer.domElement);
 const scene = new THREE.Scene();
 scene.background = new THREE.Color(0x101216);
 const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 10000);

 // ---- mesh -------------------------------------------------------------
 const geo = new THREE.BufferGeometry();
 geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(P.mesh.positions)), 3));
 geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(b64buf(P.mesh.uvs)), 2));
 geo.setIndex(new THREE.BufferAttribute(new Uint32Array(b64buf(P.mesh.indices)), 1));
 geo.computeVertexNormals();
 geo.computeBoundingBox();
 const bb = geo.boundingBox, ctr = new THREE.Vector3();
 bb.getCenter(ctr);
 const diag = bb.min.distanceTo(bb.max);

 const tex = new THREE.TextureLoader().load(P.texture, t => {
   t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
 });
 const matTex = new THREE.MeshBasicMaterial({map: tex, side: THREE.DoubleSide});
 const matShade = new THREE.MeshStandardMaterial({map: tex, side: THREE.DoubleSide,
   roughness: 0.85, metalness: 0.0});
 const matPlain = new THREE.MeshStandardMaterial({color: 0xb89880, side: THREE.DoubleSide,
   roughness: 0.9});
 const mesh = new THREE.Mesh(geo, matTex);
 scene.add(mesh);
 const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({wireframe: true,
   color: 0x44ff88, transparent: true, opacity: 0.25}));
 wire.visible = false; scene.add(wire);

 scene.add(new THREE.HemisphereLight(0xffffff, 0x404060, 1.1));
 const dl = new THREE.DirectionalLight(0xffffff, 1.2);
 dl.position.set(ctr.x + diag, ctr.y - diag, ctr.z + diag); scene.add(dl);

 // ---- cameras ------------------------------------------------------------
 const cgeo = new THREE.BufferGeometry();
 cgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(P.cameras.segments)), 3));
 cgeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(b64buf(P.cameras.colors)), 3));
 const cams = new THREE.LineSegments(cgeo, new THREE.LineBasicMaterial({vertexColors: true,
   transparent: true, opacity: 0.55}));
 cams.visible = false; scene.add(cams);

 // ---- landmarks ----------------------------------------------------------
 const lgeo = new THREE.BufferGeometry();
 lgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(b64buf(P.landmarks.positions)), 3));
 lgeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(b64buf(P.landmarks.colors)), 3));
 const lm = new THREE.Points(lgeo, new THREE.PointsMaterial({vertexColors: true, size: 0.35}));
 lm.visible = false; scene.add(lm);

 // ---- grid + axes ---------------------------------------------------------
 const grid = new THREE.GridHelper(Math.ceil(diag/100)*100, Math.ceil(diag/100)*10,
   0x39455c, 0x222a38);
 grid.rotation.x = Math.PI/2;
 grid.position.set(ctr.x, ctr.y, bb.min.z - 4);
 scene.add(grid);
 const axes = new THREE.AxesHelper(30);
 axes.position.set(bb.min.x - 10, bb.min.y - 10, bb.min.z);
 scene.add(axes);

 // ---- controls + views -----------------------------------------------------
 const controls = new OrbitControls(camera, renderer.domElement);
 controls.target.copy(ctr);
 controls.enableDamping = true; controls.dampingFactor = 0.12;
 function setView(dx, dy, dz, d) {
   d = d || diag * 1.1;
   camera.position.set(ctr.x + dx*d, ctr.y + dy*d, ctr.z + dz*d);
   camera.up.set(0, dz === 0 ? 0 : -1, dz === 0 ? 1 : 0);
   controls.target.copy(ctr); controls.update();
 }
 setView(0.25, 0.55, 0.8);
 $('bt_top').onclick   = () => setView(0, 0.001, 1);
 $('bt_front').onclick = () => setView(0, -1, 0.15);
 $('bt_side').onclick  = () => setView(1, 0, 0.15);
 $('bt_reset').onclick = () => setView(0.25, 0.55, 0.8);
 $('bt_shot').onclick  = () => {
   renderer.render(scene, camera);
   const a = document.createElement('a');
   a.href = renderer.domElement.toDataURL('image/png');
   a.download = 'skin_scan_3d.png'; a.click();
 };

 // ---- toggles --------------------------------------------------------------
 function updateMat() {
   const t = $('cb_tex').checked, s = $('cb_shade').checked;
   mesh.material = t ? (s ? matShade : matTex) : matPlain;
 }
 $('cb_tex').onchange = updateMat;
 $('cb_shade').onchange = updateMat;
 $('cb_wire').onchange = e => wire.visible = e.target.checked;
 $('cb_cams').onchange = e => cams.visible = e.target.checked;
 $('cb_lm').onchange   = e => lm.visible = e.target.checked;
 $('cb_grid').onchange = e => grid.visible = e.target.checked;

 // ---- stats ----------------------------------------------------------------
 const S = P.stats;
 $('stats').textContent =
   `${S.n_frames} frames · ${S.n_landmarks} landmarks` +
   `\nreproj RMS ${S.rms_px} px (≈${S.rms_mm} mm)` +
   `\n${S.px_per_mm} px/mm on skin · area ${S.area_cm2} cm²`;

 // ---- picking: cursor readout + measurement --------------------------------
 const ray = new THREE.Raycaster();
 const ptr = new THREE.Vector2();
 const readout = $('readout'), measEl = $('measure');
 let downXY = null, marks = [], mline = null;
 const mkMark = p => {
   const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.6, diag/400), 16, 12),
     new THREE.MeshBasicMaterial({color: 0xffd479}));
   m.position.copy(p); scene.add(m); return m;
 };
 function pick(ev) {
   ptr.x = (ev.clientX/innerWidth)*2 - 1; ptr.y = -(ev.clientY/innerHeight)*2 + 1;
   ray.setFromCamera(ptr, camera);
   const hit = ray.intersectObject(mesh, false);
   return hit.length ? hit[0].point : null;
 }
 addEventListener('pointermove', ev => {
   const p = pick(ev);
   readout.firstChild.textContent = p ?
     `x ${p.x.toFixed(2)}  y ${p.y.toFixed(2)}  z ${p.z.toFixed(2)} mm ` : 'cursor: — ';
 });
 addEventListener('pointerdown', ev => downXY = [ev.clientX, ev.clientY]);
 addEventListener('pointerup', ev => {
   if (!downXY) return;
   const moved = Math.hypot(ev.clientX-downXY[0], ev.clientY-downXY[1]);
   downXY = null;
   if (moved > 5 || ev.button !== 0) return;
   const p = pick(ev);
   if (!p) return;
   if (marks.length === 2) { clearMeasure(); }
   marks.push(mkMark(p));
   if (marks.length === 2) {
     const a = marks[0].position, b = marks[1].position;
     const g = new THREE.BufferGeometry().setFromPoints([a, b]);
     mline = new THREE.Line(g, new THREE.LineBasicMaterial({color: 0xffd479}));
     scene.add(mline);
     measEl.textContent = `measure: ${a.distanceTo(b).toFixed(2)} mm`;
   } else {
     measEl.textContent = 'measure: pick second point…';
   }
 });
 function clearMeasure() {
   marks.forEach(m => scene.remove(m)); marks = [];
   if (mline) scene.remove(mline); mline = null;
   measEl.textContent = 'measure: click two points';
 }
 addEventListener('dblclick', clearMeasure);

 addEventListener('resize', () => {
   camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
   renderer.setSize(innerWidth, innerHeight);
 });
 (function loop(){ requestAnimationFrame(loop); controls.update();
   renderer.render(scene, camera); })();
})();
</script></body></html>
