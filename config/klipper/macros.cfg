[gcode_macro HOME_X_SAFE]
description: Home the X axis only after clearing any previous emergency stop.
gcode:
  FIRMWARE_RESTART
  G28 X

[gcode_macro MOVE_X_MM]
description: Move X to an absolute position in millimeters, example: MOVE_X_MM X=125 F=1200
gcode:
  {% set target = params.X|float %}
  {% set feed = params.F|default(1200)|float %}
  G90
  G1 X{target} F{feed}

