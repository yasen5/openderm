[project]
name = "openderm"
version = "0.1.0"
description = "Open robotic skin imaging, 3D reconstruction, and longitudinal lesion comparison."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Robot control and capture (Raspberry Pis).
hardware = [
    "adafruit-circuitpython-ads1x15>=2.4",
    "fastapi>=0.110",
    "gpiod>=2.2",
    "gpiozero>=2.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyserial>=3.5",
    "smbus2>=0.4.3",
    "uvicorn>=0.29",
    "websockets>=12,<14",
]

# Vision processing (src/processing): registration and mole tracking. Runs on the
# workstation, not the Pis. Install with:  pip install -e ".[vision]"
vision = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "matplotlib>=3.8",
]

# sim-capture (src/sim_capture): stand-in for src/capture when the gantry is
# unavailable. COLMAP (via pycolmap, CPU wheel is enough) estimates poses from a
# folder of freehand photos. Tested against pycolmap 4.2.
sim = [
    "pycolmap>=4",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
]

# Offline collision-envelope generation. Runtime collision checks use NumPy
# only and do not require the CAD/FCL stack.
collision = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh",
    "yourdfpy",
    "python-fcl",
]

[dependency-groups]
dev = [
    "pydantic>=2.6",
    "pytest>=8.3,<9",
    "pyright==1.1.411",
    "ruff==0.15.14",
]

[project.scripts]
openderm = "capture.app.cli:main"
openderm-canon-capture = "capture.camera.canon:main"
openderm-sensors = "capture.sensors.hg_c:main"
openderm-limit-switches = "capture.sensors.limit_switches:main"
openderm-gantry-server = "capture.motion.gantry.server:main"
openderm-rx-axis-server = "capture.motion.rx_axis.server:main"
openderm-pico-bridge = "capture.motion.pico.bridge:main"
openderm-regulate = "capture.scanning.regulate:main"
openderm-sim-capture = "sim_capture.cli:main"
openderm-scan = "capture.scanning.cli:main"
# Vision commands require the [vision] extra.
openderm-process = "capture.processing:main"
openderm-register = "processing.register_scan_3d:main"
openderm-check-ghosts = "processing.ghost_check:main"
openderm-check-doublings = "processing.find_doublings:main"
openderm-compare = "processing.compare_scans:main"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["capture", "capture.*", "processing", "processing.*", "sim_capture", "sim_capture.*"]

[tool.setuptools.package-data]
processing = ["assets/*.html"]

[tool.setuptools.data-files]
"share/openderm/config/cad" = ["config/cad/collision_envelope.npz"]
"share/openderm/pico" = ["src/pico/gantry_firmware.py"]
"share/openderm/third_party/threejs" = [
    "third_party/threejs/three.module.min.js",
    "third_party/threejs/OrbitControls.js",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

[tool.uv]
required-version = "==0.11.16"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
ignore = [
    # The scan configuration modules intentionally re-export constants with
    # ``from .config import *``; names are bounded by config.__all__.
    "F405",
]

[tool.pyright]
include = ["src/capture", "src/processing", "src/sim_capture"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
